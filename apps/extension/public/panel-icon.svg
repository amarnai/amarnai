<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104">
  <!-- The Aziru rail icon: a clay tile with the logomark knocked out in cream.
       Sole consumer: InboxSDK's addSidebarContentPanel `iconUrl`, which takes a
       URL and cannot take a node.
       A tile rather than the bare mark, deliberately: Gmail's companion rail
       renders icons in a ~20px square slot, and the bare mark — three thin
       wedges, mostly negative space — read as a faint sliver next to Gmail's
       solid glyphs and was missed outright. The filled tile is the rail-slot
       treatment only; every in-page surface still draws the bare mark from
       content/core/logoMark.ts — keep the wedge geometry in step with it
       (translated here to center the 72x88 mark in the square).
       Colors are baked in rather than currentColor because currentColor does
       not inherit into a URL-loaded SVG; it would render black.
       Clay brand: #BB5B33 on light surfaces, #CD6A3F on dark; the media query
       is honored inside <img> SVGs and tracks the OS scheme. -->
  <style>
    @media (prefers-color-scheme: dark) {
      rect { fill: #CD6A3F; }
    }
  </style>
  <rect width="104" height="104" rx="22" fill="#BB5B33"/>
  <g transform="translate(16 8)" fill="#FAF9F6">
    <polygon points="36.1,0 54,13.2 72,0 54,87.6"/>
    <polygon points="41.3,36 0,22.8 9.9,36 0,49"/>
    <polygon points="41.2,66.4 0,53.2 9.9,66.4 0.1,79.5"/>
  </g>
</svg>
