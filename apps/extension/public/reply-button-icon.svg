<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Amarnai Reply — canonical icon.
       Geometry derived from the Amarnai logo wedge (aspect ~1.58:1,
       barb notch depth ~24% of length), mirrored to point left.
       Sole consumer: InboxSDK's compose-button `iconUrl`, which takes a URL and
       cannot take a node. The hand-rolled buttons inline the same geometry from
       content/core/replyIcon.ts instead — keep the two in step.
       Colors are baked in rather than currentColor because currentColor does
       not inherit into a URL-loaded SVG; it would render black.
       Clay brand: #BB5B33 on light surfaces, #CD6A3F on dark; the media query
       is honored inside <img> SVGs and tracks the OS scheme (checked against
       Gmail's own theme in QA). -->
  <style>
    polygon { fill: #BB5B33; }
    @media (prefers-color-scheme: dark) {
      polygon { fill: #CD6A3F; }
    }
  </style>
  <polygon points="2,12 22,5.7 17.1,12 22,18.3"/>
</svg>
