services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amarnai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amarnai}
      POSTGRES_DB: ${POSTGRES_DB:-amarnai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama
    profiles:
      - local-ai
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  postgres_data:
  ollama:
