name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm typecheck
      - run: pnpm lint

  parity-check:
    name: Client parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn on web-only user-facing changes
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          touched_web=$(echo "$changed" | grep -E '^(apps/web|packages/ui)/' || true)
          touched_extension=$(echo "$changed" | grep -E '^apps/extension/' || true)
          if [[ -n "$touched_web" && -z "$touched_extension" ]]; then
            echo "::warning title=Client parity::This push changes apps/web or packages/ui but not apps/extension. If the change is user-facing, mirror it in the browser extension or record the gap in docs/platform-parity.md. (The mobile app is shelved and is not part of parity.)"
            echo "Web/UI files changed without a matching extension change:"
            echo "$touched_web"
          else
            echo "Parity check OK (no web-only user-facing drift detected)."
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm test
