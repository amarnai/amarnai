# Gates every pull request on a signed Contributor License Agreement (see /CLA.md).
# Uses the standard CLA Assistant Lite action (contributor-assistant/github-action).
# Signatures are stored in a repo-owned JSON file (signatures/cla.json) on a
# dedicated branch, so the record lives in this repository and not a third party.
# Only the contributor's public GitHub username and signing timestamp are stored;
# see CLA.md for the retention terms disclosed to contributors.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/BenAzlay/amarnai/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],bot*'
          # Comment shown on the PR asking the contributor to sign.
          custom-notsigned-prcomment: 'Thank you for your contribution. Before we can merge, please read our [Contributor License Agreement](https://github.com/BenAzlay/amarnai/blob/main/CLA.md) and sign it by posting the comment below.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          lock-pullrequest-aftermerge: false
